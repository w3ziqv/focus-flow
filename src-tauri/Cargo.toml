[package]
name = "focus-flow"
version = "3.0.0-alpha.1"
description = "A quiet, local-first Pomodoro companion"
authors = ["Mateusz Szostak"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "focus_flow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic-write-file = "0.3"
resvg = { version = "0.45", default-features = false }
mdns-sd = "0.13"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
keepawake = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "form"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
open = "5"
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "windows-native"] }

[patch.crates-io]
glib = { path = "vendor/glib" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
glib = "0.18.5"
