name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - name: Select npm and record runtime
        run: npm install --global npm@12.2.2 && node --version && npm --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx --yes firebase-tools@15.35.0 emulators:exec --only firestore --project demo-focus-flow-security "npm run test:rules && npm run test:integration"
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
