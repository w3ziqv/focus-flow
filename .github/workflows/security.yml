name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  firestore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Isolate Firebase CLI on its supported runtime
        run: |
          npm install --global npm@12.2.2
          node --version && npm --version
          npm install --prefix "$RUNNER_TEMP/firebase-tools" --no-package-lock --ignore-scripts firebase-tools@15.35.0
          echo "FIREBASE_TOOLS_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "FIREBASE_TOOLS_CLI=$RUNNER_TEMP/firebase-tools/node_modules/firebase-tools/lib/bin/firebase.js" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 27
      - name: Select npm and record runtime
        run: npm install --global npm@12.2.2 && node --version && npm --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Run the emulator with Node 24 and application tests with Node 26
        run: |
          "$FIREBASE_TOOLS_NODE" "$FIREBASE_TOOLS_CLI" --version
          node --version && npm --version
          "$FIREBASE_TOOLS_NODE" "$FIREBASE_TOOLS_CLI" emulators:exec --only firestore --project demo-focus-flow-security "node --version && npm run test:rules && npm run test:integration"
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file src-tauri/Cargo.lock
