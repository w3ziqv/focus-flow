name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select npm and record runtime
        run: npm install --global npm@12.2.2 && node --version && npm --version
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run design:check
      - run: npm run test:ui-boundaries
      - run: npm run test:toolchain
      - run: npm run typecheck
      - run: npm run typecheck:node
      - run: node --test scripts/test-desktop-cloud-config.mjs
      - run: npm run test:run
      - run: npm run build
      - run: npm run build:desktop
      - run: npm run verify:builds

  responsive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select npm and record runtime
        run: npm install --global npm@12.2.2 && node --version && npm --version
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:responsive
      - run: npm run test:a11y
      - run: npm run test:ui-interactions
      - run: npm run test:guides
      - run: npm run test:motion
      - run: npm run build
      - run: npm run test:stress
